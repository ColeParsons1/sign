name: Felt
options:
  bundleIdPrefix: com.supremelabssoftware
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: MQ7A2U7JWY
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "9"
    # optimised even in the debug builds installed on the phone: the note reader runs slower than the music without it
    SWIFT_OPTIMIZATION_LEVEL: "-O"
targets:
  Felt:
    type: application
    platform: iOS
    sources: [iOS, Shared]
    entitlements:
      path: iOS/Felt.entitlements
      properties:
        com.apple.security.application-groups: [group.com.supremelabssoftware.felt]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.supremelabssoftware.felt
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone and iPad (the iPad full screen)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Felt
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # (an iPad app must allow every orientation, or App Store Connect refuses the build)
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: iOS/Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        NSSpeechRecognitionUsageDescription: Felt picks out the words being sung so the Sign scene can fingerspell them.
        NSMicrophoneUsageDescription: Felt listens to the music around you so it can turn it into vibration and light.
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleExternalDisplayNonInteractive:
              - UISceneConfigurationName: Big Screen
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).BigScreenSceneDelegate
    dependencies:
      - target: FeltWatch
      - target: FeltBroadcast
  FeltBroadcast:
    type: app-extension
    platform: iOS
    sources: [Broadcast, Shared]
    entitlements:
      path: Broadcast/FeltBroadcast.entitlements
      properties:
        com.apple.security.application-groups: [group.com.supremelabssoftware.felt]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.supremelabssoftware.felt.broadcast
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone and iPad (the iPad full screen)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Felt
    info:
      path: Broadcast/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
  FeltWatch:
    type: application
    platform: watchOS
    sources: [Watch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.supremelabssoftware.felt.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Felt
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.supremelabssoftware.felt
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Watch/Info.plist
      properties:
        WKApplication: true
        WKBackgroundModes: [mindfulness]
